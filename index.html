<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixblock Server</title>
    <link rel="icon" href="https://github.com/Pixblock/Homepage/blob/main/Pixblock.jpg?raw=true">
    <!-- 使用 Pixel 风格的字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            background-image: radial-gradient(circle at 20% 30%, #2d2d2d 0%, #0d0d0d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            padding: 20px;
        }

        .card {
            max-width: 820px;
            width: 100%;
            background: rgba(30, 30, 40, 0.85);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 2px solid #4a4a5a;
            border-radius: 36px;
            padding: 40px 35px 45px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 2px #2a2a3a inset;
            transition: all 0.2s ease;
            color: #eaeef2;
        }

        /* 顶部区域：图标 + 标题 */
        .header {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
            border-bottom: 2px solid #3f3f52;
            padding-bottom: 22px;
            margin-bottom: 28px;
        }

        .logo-wrapper {
            flex-shrink: 0;
            width: 90px;
            height: 90px;
            background: #1e1e2a;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #5a5a72;
            box-shadow: 0 6px 0 #0b0b10;
            overflow: hidden;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .title-group h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f0e68c, #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 8px rgba(255, 180, 50, 0.2);
            font-family: 'Press Start 2P', 'Segoe UI', monospace;
            font-size: 26px;
            line-height: 1.3;
        }

        .title-group .subhead {
            font-size: 15px;
            color: #9aa5b5;
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px 20px;
            background: #23232f;
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid #3f3f52;
            letter-spacing: 0.3px;
        }

        .subhead span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .subhead i {
            font-style: normal;
            opacity: 0.7;
        }

        /* 信息网格 */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px 24px;
            background: #1f1f2b;
            border-radius: 28px;
            padding: 24px 26px;
            border: 1px solid #3b3b4d;
            margin-bottom: 30px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-item .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #818fa0;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .info-item .value {
            font-size: 17px;
            font-weight: 500;
            word-break: break-word;
            color: #d6dee8;
        }

        .info-item .value .ip-main {
            background: #2f3a4a;
            padding: 2px 12px;
            border-radius: 30px;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #b7d0f0;
            border: 1px solid #4d5e77;
            display: inline-block;
            font-size: 15px;
        }

        .info-item .value .ip-backup {
            font-family: 'Courier New', monospace;
            color: #9aabbf;
            font-size: 14px;
        }

        .badge-time {
            background: #2e3a2e;
            border: 1px solid #4f6b4f;
            border-radius: 40px;
            padding: 2px 14px;
            font-size: 14px;
            color: #b8d9b8;
            display: inline-block;
        }

        /* 游戏列表 */
        .games-section {
            background: #16161f;
            border-radius: 28px;
            padding: 22px 26px;
            border: 1px solid #353545;
            margin-bottom: 30px;
        }

        .games-section h3 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #bcc7d6;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .games-section h3:after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, #45455a, transparent);
        }

        .game-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
        }

        .game-tag {
            background: #262633;
            padding: 6px 18px;
            border-radius: 60px;
            border: 1px solid #4a4a62;
            font-weight: 500;
            font-size: 16px;
            color: #d6dee8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .game-tag .status-badge {
            font-size: 11px;
            background: #2a5a2a;
            padding: 0 10px;
            border-radius: 30px;
            color: #a8e0a8;
            border: 1px solid #3d7a3d;
        }

        .game-tag .status-badge.wip {
            background: #5a4a2a;
            border-color: #7a6a3d;
            color: #f0d68a;
        }

        .game-tag .status-badge.more {
            background: #3a3a4a;
            border-color: #5a5a6a;
            color: #b0b8c8;
        }

        /* 底部：服主 + QQ群 */
        .footer-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px 20px;
            padding-top: 20px;
            border-top: 2px solid #323245;
            margin-top: 6px;
        }

        .owner-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 20px;
            font-size: 15px;
        }

        .owner-area .owner-label {
            color: #8896a8;
            font-weight: 400;
        }

        .owner-area .owner-name {
            font-weight: 600;
            color: #d6dee8;
            background: #262634;
            padding: 2px 14px;
            border-radius: 40px;
            border: 1px solid #404056;
        }

        .qq-group {
            background: #1f2a3a;
            padding: 6px 20px 6px 18px;
            border-radius: 60px;
            border: 1px solid #3d5a7a;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            color: #b7d0f0;
            font-size: 15px;
        }

        .qq-group .qq-icon {
            font-size: 20px;
            line-height: 1;
        }

        .qq-group a {
            color: #8ab4f8;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .qq-group a:hover {
            color: #b8d6ff;
            text-decoration: underline;
        }

        /* 移动端调整 */
        @media (max-width: 600px) {
            .card {
                padding: 24px 18px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
            }
            .logo-wrapper {
                width: 70px;
                height: 70px;
            }
            .title-group h1 {
                font-size: 22px;
            }
            .info-grid {
                grid-template-columns: 1fr;
                padding: 18px;
            }
            .footer-info {
                flex-direction: column;
                align-items: flex-start;
            }
            .qq-group {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
